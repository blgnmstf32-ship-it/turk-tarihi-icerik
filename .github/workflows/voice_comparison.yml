name: Piri Reis · Gemini Charon ve Piper

on:
  workflow_dispatch:
    inputs:
      confirm_gemini_free_project:
        description: 'GEMINI_API_KEY faturalandırma hesabı bağlanmamış Free Tier projesine ait'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: piri-reis-voice-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - name: Require explicit Free Tier confirmation
        env:
          FREE_PROJECT_CONFIRMED: ${{ inputs.confirm_gemini_free_project }}
        run: |
          if [[ "$FREE_PROJECT_CONFIRMED" != "true" ]]; then
            echo "::error::Faturalandırmasız Free Tier projesi açıkça onaylanmalı."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install video renderer and speech tools
        run: |
          npm ci
          npm run typecheck
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python -m pip install -r requirements.txt -r requirements-audio-audit.txt 'piper-tts>=1.3,<2.0'
      - uses: actions/cache@v4
        with:
          path: .cache/piper
          key: piper-tr-TR-dfki-medium-v1
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: faster-whisper-small-cpu-voice-comparison-v1
      - name: Prepare local speech recognition
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          from voice_lab import ASR_MODEL
          WhisperModel(ASR_MODEL, device='cpu', compute_type='int8')
          PY
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Generate one real Gemini Charon take
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m voice_lab gemini --out output/voice-lab --confirm-gemini-free-project
      - name: Render both videos and audit their final audio and captions
        run: python -m voice_lab compare --out output/voice-lab
      - name: Upload the two unpublished drafts and comparison data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piri-reis-voice-comparison-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            output/voice-lab/PIRI_REIS_*_INCELEME.mp4
            output/voice-lab/*.srt
            output/voice-lab/*.json
            output/voice-lab/*.txt
            output/voice-lab/MEDIA_ATTRIBUTION.md
            output/voice-lab/GEMINI_CHARON.wav
            output/voice-lab/PIPER.wav
          if-no-files-found: warn
          retention-days: 14
