name: Skill security · static and secret scanning

on:
  push:
    branches: [main, skill-security]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install hash-pinned static scanners in runner storage
        run: |
          tools_dir="$RUNNER_TEMP/skill-security"
          mkdir -p "$tools_dir"
          python -m venv "$tools_dir/venv"
          "$tools_dir/venv/bin/python" -m pip install --disable-pip-version-check \
            --no-deps --only-binary=:all: --require-hashes -r requirements-skill-security.txt
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$tools_dir/gitleaks.tar.gz"
          (cd "$tools_dir" && sha256sum -c <<'SHA'
          551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz
          SHA
          )
          tar -xOzf "$tools_dir/gitleaks.tar.gz" gitleaks > "$tools_dir/gitleaks"
          chmod 755 "$tools_dir/gitleaks"
          "$tools_dir/venv/bin/skill-scanner" --version
          "$tools_dir/gitleaks" version
      - name: Verify the real scanners and audit the repository with no network
        run: |
          tools_dir="$RUNNER_TEMP/skill-security"
          sudo unshare --net -- runuser -u "$(id -un)" -- env -i PATH=/usr/bin:/bin LANG=C.UTF-8 \
            "SECURITY_CISCO=$tools_dir/venv/bin/skill-scanner" "SECURITY_GITLEAKS=$tools_dir/gitleaks" \
            bash -euc '
              test -z "$(ip route show default)"
              test -z "$(ip -6 route show default)"
              "$1/venv/bin/python" -m unittest scripts.skill_security_contracts -v
              "$1/venv/bin/python" -m scripts.skill_security \
                --cisco "$SECURITY_CISCO" --gitleaks "$SECURITY_GITLEAKS"
            ' _ "$tools_dir"
