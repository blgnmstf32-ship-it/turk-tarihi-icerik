name: Türk tarihi kalite testleri
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and typecheck Remotion project
        run: npm ci && npm run typecheck
      - name: Verify deterministic animation geometry and HTML without rendering
        run: node --experimental-strip-types --test tests/editorial_animation.test.mjs
      - run: python -m pip install -r requirements.txt
      - name: Run offline Python quality tests and report media fixtures separately
        run: python -m scripts.quality_checks
