name: Türk tarihi kalite testleri
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and typecheck Remotion project
        run: npm ci --ignore-scripts --no-audit && npm run typecheck
      - name: Verify deterministic animation geometry and HTML without rendering
        run: node --experimental-strip-types --test tests/editorial_animation.test.mjs
      - run: python -m pip install -r requirements.txt
      - name: Verify context output preserves evidence and failures
        run: python -m unittest scripts.context_output_contracts -v
      - name: Run offline Python quality tests and preview the log
        run: |
          folder="$RUNNER_TEMP/quality-logs"
          mkdir -p "$folder"
          raw="$folder/quality.raw.txt"
          preview="$folder/quality.preview.txt"
          status=0
          python -m scripts.quality_checks > "$raw" 2>&1 || status=$?
          if ! python -m scripts.context_output unittest "$raw" --exit-code "$status" > "$preview"; then
            cp "$raw" "$preview"
            if [[ "$status" == 0 ]]; then status=2; fi
          fi
          cat "$preview"
          wc -c "$raw" "$preview"
          exit "$status"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: offline-quality-logs
          path: ${{ runner.temp }}/quality-logs/*.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate optional OTIO and export offline scene plans
        run: |
          wheel_dir="$RUNNER_TEMP/scene-otio"
          python -m pip install --only-binary=:all: --no-deps --require-hashes \
            --index-url https://pypi.org/simple --target "$wheel_dir" -r requirements-scene-otio.txt
          sudo unshare --net -- runuser -u "$(id -un)" -- env -i \
            PATH=/usr/bin:/bin LANG=C.UTF-8 "PYTHONPATH=$wheel_dir" "SCENE_OUTPUT=$RUNNER_TEMP/scene-plans" \
            "SCENE_PYTHON=$(command -v python)" /bin/bash -e -c '
              "$SCENE_PYTHON" -m unittest scripts.scene_otio_contracts -v
              "$SCENE_PYTHON" -m scripts.scene_director --brand tarih --topic piri-reis-kayip-kaynak --out "$SCENE_OUTPUT/tarih" --otio
              "$SCENE_PYTHON" -m scripts.scene_director --brand bakim --topic kuruluk-nemlendirici-zamani --out "$SCENE_OUTPUT/bakim" --otio
              for topic in lazer-on-gorusme cilt-bariyeri-katmanlari gunes-koruyucu-etiketi; do
                "$SCENE_PYTHON" -m scripts.beauty_reel --topic "$topic" --out "$SCENE_OUTPUT/$topic" --otio
              done
            '
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: offline-scene-plans
          path: |
            ${{ runner.temp }}/scene-plans/*/SCENE_*.json
            ${{ runner.temp }}/scene-plans/*/SCENE_TIMELINE.otio
            ${{ runner.temp }}/scene-plans/*/BEAUTY_*.json
            ${{ runner.temp }}/scene-plans/*/REELS_EDITORIAL_REVIEW.json
            ${{ runner.temp }}/scene-plans/*/TR_TASLAK.srt
          if-no-files-found: error
          retention-days: 7
