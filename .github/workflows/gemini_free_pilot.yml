name: Gemini Free Tier · Dal doğrulaması
on:
  push:
    branches: [daily-editorial]
    paths: [.github/workflows/gemini_free_pilot.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Verify Flash, Flash-Lite, and Gemma with the confirmed free key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENABLE_GEMINI_EDITORIAL: "1"
          GEMINI_FREE_TIER_CONFIRMED: "1"
        run: python -m scripts.provider_smoke free --out output/free-provider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-free-model-results
          path: output/free-provider/*.json
          retention-days: 7
