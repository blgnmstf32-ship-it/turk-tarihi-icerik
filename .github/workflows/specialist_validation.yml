name: Editoryal · İki marka canlı uzman doğrulaması
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/specialist_validation.yml]
permissions:
  contents: read
concurrency:
  group: turk-tarihi-content-drafts
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Check dispatch, quota and renderer-independent safety
        run: python -m unittest discover -s tests -q
      - name: Restore the shared main-branch editorial responses and quota ledger
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/editorial-llm.sqlite3
            .cache/gemini-quota.sqlite3
            .cache/gemini-voice
          key: editorial-llm-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            editorial-llm-v1-
      - name: Check real text models, research, roles and both editorial managers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY != secrets.GEMINI_IMAGE_API_KEY && secrets.GEMINI_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ENABLE_GEMINI_EDITORIAL: "1"
          GEMINI_FREE_TIER_CONFIRMED: "1"
          ENABLE_20_LLM_AGENTS: "1"
        run: |
          python -m scripts.specialist_validation --out output/specialist-validation
      - name: Save the shared ledger even after partial results
        if: ${{ always() && hashFiles('.cache/editorial-llm.sqlite3') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/editorial-llm.sqlite3
            .cache/gemini-quota.sqlite3
            .cache/gemini-voice
          key: editorial-llm-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload per-role evidence and separate brand reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specialist-live-validation-${{ github.run_number }}
          path: output/specialist-validation/**/*.json
          if-no-files-found: error
          retention-days: 14
