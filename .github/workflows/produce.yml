name: Tarihin Bilinmeyen Gerçekleri · Haftalık rapor ve Reels
on:
  push:
    paths:
      - '.github/workflows/produce.yml'
      - 'scripts/**'
      - 'config/**'
      - 'remotion/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements*.txt'
  workflow_dispatch:
    inputs:
      topic:
        description: 'İçerik konusu (örn: antikythera-disli); boşsa otomatik seç'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '17 9 * * 2' # Türkiye 12:17; GitHub schedule gecikebilir
permissions:
  contents: read
concurrency:
  group: turk-tarihi-content-drafts
  cancel-in-progress: true
jobs:
  create-narrated-review-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Remotion renderer
        run: npm ci && npm run typecheck
      - name: Install FFmpeg and open source TTS
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
          pip install -r requirements.txt
          pip install 'piper-tts>=1.3,<2.0'
          pip install -r requirements-audio-audit.txt 'av>=11,<18'
      - name: Cache free Turkish Piper voice model
        uses: actions/cache@v4
        with:
          path: .cache/piper
          key: piper-tr-TR-dfki-medium-v1
      - name: Cache free Turkish speech audit model
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: faster-whisper-tiny-cpu-v1
      - name: Prepare offline speech audit model
        env:
          HF_HOME: ${{ github.workspace }}/.cache/huggingface
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          WhisperModel('tiny', device='cpu', compute_type='int8')
          PY
      - name: Validate 24 task modules and safety gates
        run: python -m unittest discover -s tests -v
      - name: AI General Editor research and weekly strategy
        env:
          ENABLE_FREE_LLM: ${{ vars.ENABLE_FREE_LLM || '0' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: |
          flags=()
          if [[ "$ENABLE_FREE_LLM" == "1" ]]; then flags+=(--require-llm); fi
          python -m scripts.editorial_board --out output/auto/editorial "${flags[@]}"
      - name: Produce selected narrated documentary video
        env:
          TOPIC_ID: ${{ inputs.topic || '' }}
          ENABLE_FREE_LLM: '0'
          ENABLE_20_LLM_AGENTS: '0'
          HF_HOME: ${{ github.workspace }}/.cache/huggingface
        run: python -m scripts.auto_produce --topic "$TOPIC_ID" --out output/auto --model-cache .cache/piper
      - name: Verify MP4, format, and Turkish speech
        env:
          HF_HOME: ${{ github.workspace }}/.cache/huggingface
          TOPIC_ID: ${{ inputs.topic || '' }}
        run: python -m scripts.verify_production --out output/auto --topic "$TOPIC_ID"
      - name: Save review package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarihin-bilinmeyen-gercekleri-${{ github.run_number }}
          path: |
            output/auto/**
            output/observer/**
          retention-days: 14
          if-no-files-found: warn
