name: Türk tarihi ücretsiz sesli Reels taslağı
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'İçerik konusu (örn: malazgirt-1071); boşsa otomatik seç'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '17 9 * * 2,5' # Türkiye 12:17; GitHub schedule gecikebilir
permissions:
  contents: read
concurrency:
  group: turk-tarihi-content-drafts
  cancel-in-progress: false
jobs:
  create-narrated-review-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Remotion renderer
        run: npm ci && npm run typecheck
      - name: Install FFmpeg and open source TTS
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
          pip install -r requirements.txt
          pip install 'piper-tts>=1.3,<2.0'
