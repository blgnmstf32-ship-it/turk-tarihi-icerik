name: Media final QA · approved assets
on:
  workflow_dispatch:
  push:
    branches: [media-final-qa]
    paths: [.github/workflows/media_final_qa.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: approved-media-final-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements.txt
      - name: Run all Python tests including media fixtures
        run: python -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run typecheck && node --experimental-strip-types --test tests/editorial_animation.test.mjs

  cpu-pilot:
    strategy:
      fail-fast: false
      matrix:
        brand: [history, beauty]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DO_NOT_TRACK: "1"
      HYPERFRAMES_NO_TELEMETRY: "1"
      HYPERFRAMES_NO_UPDATE_CHECK: "1"
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      NUMBA_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            media_pilot/package-lock.json
      - name: Install pinned existing media dependencies
        env:
          BRAND: ${{ matrix.brand }}
        run: |
          sudo apt-get update
          packages=(ffmpeg fonts-dejavu-core)
          if [[ "$BRAND" == beauty ]]; then packages+=(blender); fi
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          python -m pip install -r requirements-media-pilot.txt psutil==7.2.2
          npm ci --ignore-scripts --no-audit
          npm --prefix media_pilot ci --ignore-scripts --no-audit
          npx --no-install remotion browser ensure
      - uses: actions/download-artifact@v4
        if: matrix.brand == 'history'
        with:
          github-token: ${{ github.token }}
          run-id: 45649575775
          name: tarihin-bilinmeyen-gercekleri-4
          path: output/qa-input/history
      - uses: actions/download-artifact@v4
        if: matrix.brand == 'beauty'
        with:
          github-token: ${{ github.token }}
          run-id: 45702177750
          name: beauty-reel-kuru-cilt-2
          path: output/qa-input/beauty
      - uses: actions/download-artifact@v4
        if: matrix.brand == 'beauty'
        with:
          github-token: ${{ github.token }}
          run-id: 45654042857
          name: beauty-sulafat-and-nano-assets
          path: output/qa-input/assets
      - name: Fetch and verify the pinned CPU Whisper model
        run: |
          mkdir -p output/qa-input/whisper
          base=https://huggingface.co/Systran/faster-whisper-small/resolve/536b0662742c02347bc0e980a01041f333bce120
          for file in model.bin config.json tokenizer.json vocabulary.txt; do
            curl --fail --silent --show-error --retry 2 --location "$base/$file" -o "output/qa-input/whisper/$file"
          done
          (cd output/qa-input/whisper && sha256sum -c <<'SHAS'
          3e305921506d8872816023e4c273e75d2419fb89b24da97b4fe7bce14170d671  model.bin
          b55496ac7940a7ae47d2c01eab40edfd8701feec1229d9cce3b40014383fb828  config.json
          fb7b63191e9bb045082c79fd742a3106a12c99513ab30df4a0d47fa6cb6fd0ab  tokenizer.json
          34ce3fe1c5041027b3f8d42912270993f986dbc4bb34cf27f951e34a1e453913  vocabulary.txt
          SHAS
          )
      - name: Render and measure on a loopback-only CPU runner
        env:
          BRAND: ${{ matrix.brand }}
        run: |
          browser=$(find node_modules/.remotion -name chrome-headless-shell -type f | head -n 1)
          test -x "$browser"
          sudo unshare --net -- bash -euc '
            ip link set lo up
            test -z "$(ip route show default)"
            test -z "$(ip -6 route show default)"
            ip -brief address
            exec runuser -u "$1" -- env "PATH=$2" "GITHUB_RUN_ID=$3" \
              DO_NOT_TRACK=1 HYPERFRAMES_NO_TELEMETRY=1 HYPERFRAMES_NO_UPDATE_CHECK=1 \
              HF_HUB_OFFLINE=1 OMP_NUM_THREADS=2 NUMBA_NUM_THREADS=2 \
              "HYPERFRAMES_BROWSER_PATH=$PWD/$4" "$5" -m scripts.final_media_qa \
              --brand "$6" --history output/qa-input/history --beauty output/qa-input/beauty \
              --beauty-assets output/qa-input/assets --model output/qa-input/whisper \
              --browser "$4" --out output/final-qa
          ' _ "$(id -un)" "$PATH" "$GITHUB_RUN_ID" "$browser" "$(command -v python)" "$BRAND"
      - name: Write measurement summary
        if: always()
        env:
          BRAND: ${{ matrix.brand }}
        run: |
          for report in PERFORMANCE FINAL_QA; do
            file="output/final-qa/$BRAND/$report.json"
            if [[ -f "$file" ]]; then
              printf '### %s\n\n```json\n' "$report" >> "$GITHUB_STEP_SUMMARY"
              cat "$file" >> "$GITHUB_STEP_SUMMARY"
              if [[ "$report" == PERFORMANCE ]]; then cat "$file"; fi
              printf '\n```\n\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: final-qa-${{ matrix.brand }}
          retention-days: 14
          path: |
            output/final-qa/${{ matrix.brand }}/*FINAL.mp4
            output/final-qa/${{ matrix.brand }}/ONCE_SONRA.mp4
            output/final-qa/${{ matrix.brand }}/OZGUN_CIZIM.mp4
            output/final-qa/${{ matrix.brand }}/TARIH_KOLAJ_HYPERFRAMES.mp4
            output/final-qa/${{ matrix.brand }}/*.json
            output/final-qa/${{ matrix.brand }}/*.md
            output/final-qa/${{ matrix.brand }}/*.srt
            output/final-qa/${{ matrix.brand }}/beauty_base/*.json
            output/final-qa/${{ matrix.brand }}/beauty_base/*.srt
          if-no-files-found: warn
