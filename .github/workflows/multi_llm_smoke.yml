name: Multi-LLM · Ücretsiz metin ve sağlayıcı geçişi
on:
  workflow_dispatch:
  push:
    branches: [cloudflare-model-recovery]
    paths: [.github/workflows/multi_llm_smoke.yml]
permissions:
  contents: read
concurrency:
  group: turk-tarihi-content-drafts
  cancel-in-progress: false
jobs:
  cloudflare-text:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cloudflare-model-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Restore shared text usage
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/editorial-llm.sqlite3
            .cache/gemini-quota.sqlite3
            .cache/gemini-voice
          key: editorial-llm-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            editorial-llm-v1-
      - name: Verify Gemma and compare optional Workers AI models
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python -m scripts.multi_llm_smoke --out output/multi-llm --state .cache/editorial-llm.sqlite3
      - name: Save text usage and successful responses
        if: ${{ always() && hashFiles('.cache/editorial-llm.sqlite3') != '' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/editorial-llm.sqlite3
            .cache/gemini-quota.sqlite3
            .cache/gemini-voice
          key: editorial-llm-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload text benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-llm-text-benchmark
          path: output/multi-llm/MULTI_LLM_SMOKE.json
          if-no-files-found: error
          retention-days: 14
